[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inclusion-bench"
version = "0.1.0"
description = "An AI mathematics benchmark of open complexity-class inclusion problems"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
inclusion-bench = "inclusion_bench.cli:main"

[tool.setuptools]
packages = ["inclusion_bench"]

[tool.setuptools.data-files]
"share/inclusion-bench/data" = ["data/*.json"]
